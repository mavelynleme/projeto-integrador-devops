apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-devops-dashboard
  labels:
    app: linux-devops-dashboard
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linux-devops-dashboard
  template:
    metadata:
      labels:
        app: linux-devops-dashboard
        component: frontend
    spec:
      containers:
        - name: linux-devops-dashboard
          image: linux-devops-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: linux-devops-dashboard-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
